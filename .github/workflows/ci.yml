name: Validate full stack
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: copy
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: copy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copy -d copy_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      LLM_PROVIDER: mock
      DATABASE_URL: postgresql+asyncpg://copy:test_password@localhost:5432/copy_test
      TEST_DATABASE_URL: postgresql+asyncpg://copy:test_password@localhost:5432/copy_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check src tests scripts migrations seed_and_benchmark.py
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:8080/health/ready
      - run: docker compose exec -T api python seed_and_benchmark.py --url http://localhost:8000 --output /tmp/benchmark --repeats 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/screenshots
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
